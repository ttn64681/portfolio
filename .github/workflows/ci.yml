name: General CI Checks

# Runs on every push of any branch EXCEPT test branch.
# On master: also syncs RAG embeddings to prod db.
on:
  push:
    branches-ignore:
      - test
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Quality Checks
        uses: ./.github/actions/quality-checks
        with:
          run-build: 'true'

  # sync rag embeddings on push to master (so unmerged code or non-prod code never writes to prod embeddings)
  rag-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # waits for quality checks to pass
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Sync RAG Embeddings (Production)
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.PROD_UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.PROD_UPSTASH_REDIS_REST_TOKEN }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
        run: npm run rag:sync
